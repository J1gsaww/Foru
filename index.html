<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6dccf">
  <title>For u na</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="ripple" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.035" numOctaves="2" seed="4">
        <animate attributeName="baseFrequency" dur="16s" values="0.006 0.035;0.008 0.045;0.006 0.035" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="7"/>
    </filter>
  </svg>
  <div id="app">
    <!-- ฉากหลัง: แต่ละฉากเป็น layer ซ้อนกัน แล้วค่อย ๆ crossfade -->
    <div id="scenes"></div>

    <!-- กลีบดอกไม้ลอย / แสงลอย -->
    <div id="petals" aria-hidden="true"></div>
    <div id="motes" aria-hidden="true"></div>

    <!-- เปลือกตา (หลับตา/ลืมตา) และจอขาว -->
    <div id="lidTop" class="lid"></div>
    <div id="lidBottom" class="lid"></div>
    <div id="whiteout"></div>

    <!-- ปุ่มมุมบน -->
    <div id="hud">
      <button id="logBtn" class="hud-btn" aria-label="อ่านย้อนหลัง">☰</button>
      <button id="muteBtn" class="hud-btn" aria-label="ปิด/เปิดเสียง">🔊</button>
    </div>

    <!-- พื้นที่ข้อความ -->
    <div id="ui">
      <div id="choices"></div>
      <div id="box" class="hidden">
        <div id="name"></div>
        <div id="lines"></div>
        <div id="tapHint">แตะเพื่อไปต่อ</div>
      </div>
    </div>

    <!-- เลือกรองเท้า -->
    <div id="shoes" class="hidden">
      <div class="shoes-title">ลองเลือกดูสักคู่ไหมคะ</div>
      <div class="shoes-grid"></div>
      <button id="shoeOk" class="pill" disabled>เลือกคู่นี้</button>
    </div>

    <!-- ประวัติบทสนทนา -->
    <div id="log" class="hidden">
      <div class="log-head">
        <span>อ่านย้อนหลัง</span>
        <button id="logClose" class="hud-btn" aria-label="ปิด">✕</button>
      </div>
      <div id="logBody"></div>
    </div>

    <!-- หน้าแรก -->
    <div id="title">
      <div class="title-inner">
        <img class="title-flower" src="assets/web/hydrangea.webp" alt="">
        <h1>For u na</h1>
        <p class="title-sub">สวนเล็ก ๆ ที่ไม่มีอะไรต้องรีบ</p>
        <button id="startBtn" class="pill big">เริ่มเลย</button>
        <p class="title-note">🎧 เปิดเสียงไว้จะดีมากเลยนะ</p>
      </div>
    </div>

    <!-- หน้าจบ -->
    <div id="ending" class="hidden">
      <div class="ending-inner">
        <p class="ending-line">ที่ผ่านมา… เก่งมากแล้วนะ</p>
        <p class="ending-sub">พักให้สบายนะ คุณบีม</p>
        <button id="againBtn" class="pill">กลับไปที่สวนอีกครั้ง</button>
      </div>
    </div>
  </div>

  <script src="scenes.js"></script>
  <script src="story.js"></script>
  <script src="engine.js"></script>
</body>
</html>
